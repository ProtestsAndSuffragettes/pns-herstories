name: PHP syntax

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.0'
          - '8.3'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: find . -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
